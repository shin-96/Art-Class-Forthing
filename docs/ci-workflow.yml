name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Syntax check
        run: |
          for f in server/*.mjs public/*.js curriculum/curriculum.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: E2E smoke
        run: npm run test:e2e
